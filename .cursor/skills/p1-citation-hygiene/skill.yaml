id: p1-citation-hygiene
name: p1-citation-hygiene
description: Check citations, pin cites, and distinguish holding vs dicta.
p1:
  capability: citation-hygiene
  catalog: /v1/p1
  local_api: http://127.0.0.1:4040
when_to_use: |
  Use before delivering authorities. Prefer CourtListener URLs when present.
steps:
  - Identify the P1 slot, skill, and agent mapped on /v1/p1.
  - Prefer local-v1 / local-v1-concise. Do not call hosted LLM APIs.
  - For legal asks, search FOLIO then CourtListener via POST /v1/legal/search.
  - Return a concrete work product, not a plan to write one.
resources:
  - path: .cursor/skills/p1-citation-hygiene/SKILL.md
  - path: server/p1-catalog.ts
