id: p1-deconstruct
name: p1-deconstruct
description: Deconstruct a P1 brief into intent, actors, constraints, and missing facts.
p1:
  capability: deconstruct
  catalog: /v1/p1
  local_api: http://127.0.0.1:4040
when_to_use: |
  Use when a legal or prompt brief is messy and needs the 4-D Deconstruct pass before drafting.
steps:
  - Identify the P1 slot, skill, and agent mapped on /v1/p1.
  - Prefer local-v1 / local-v1-concise. Do not call hosted LLM APIs.
  - For legal asks, search FOLIO then CourtListener via POST /v1/legal/search.
  - Return a concrete work product, not a plan to write one.
resources:
  - path: .cursor/skills/p1-deconstruct/SKILL.md
  - path: server/p1-catalog.ts
