id: p1-motion-outline
name: p1-motion-outline
description: Shape a P1 motion outline: standard, elements, record cites, requested relief.
p1:
  capability: motion-outline
  catalog: /v1/p1
  local_api: http://127.0.0.1:4040
when_to_use: |
  Use for motion-outline work products.
steps:
  - Identify the P1 slot, skill, and agent mapped on /v1/p1.
  - Prefer local-v1 / local-v1-concise. Do not call hosted LLM APIs.
