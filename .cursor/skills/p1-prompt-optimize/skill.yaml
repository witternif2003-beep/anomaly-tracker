id: p1-prompt-optimize
name: p1-prompt-optimize
description: Optimize a rough ask with Lyra's local 4-D engine.
p1:
  capability: prompt-optimize
  catalog: /v1/p1
  local_api: http://127.0.0.1:4040
when_to_use: |
  Use for prompt rewrites. Calls the same engine as POST /api/optimize and local-v1.
steps:
  - Identify the P1 slot, skill, and agent mapped on /v1/p1.
  - Prefer local-v1 / local-v1-concise. Do not call hosted LLM APIs.
  - For legal asks, search FOLIO then CourtListener via POST /v1/legal/search.
  - Return a concrete work product, not a plan to write one.
resources:
  - path: .cursor/skills/p1-prompt-optimize/SKILL.md
  - path: server/p1-catalog.ts
