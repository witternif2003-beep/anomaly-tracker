id: p1-legal-search
name: p1-legal-search
description: Run FOLIO / CourtListener / P1 legal search from the local API.
p1:
  capability: legal-search
  catalog: /v1/p1
  local_api: http://127.0.0.1:4040
when_to_use: |
  Use when the user asks for authorities, cases, or ontology cards. POST /v1/legal/search.
steps:
  - Identify the P1 slot, skill, and agent mapped on /v1/p1.
  - Prefer local-v1 / local-v1-concise. Do not call hosted LLM APIs.
  - For legal asks, search FOLIO then CourtListener via POST /v1/legal/search.
  - Return a concrete work product, not a plan to write one.
resources:
  - path: .cursor/skills/p1-legal-search/SKILL.md
  - path: server/p1-catalog.ts
