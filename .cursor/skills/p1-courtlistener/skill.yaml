id: p1-courtlistener
name: p1-courtlistener
description: Query public CourtListener opinions through the local legal search proxy.
p1:
  capability: courtlistener
  catalog: /v1/p1
  local_api: http://127.0.0.1:4040
when_to_use: |
  Use when the user wants real case names, courts, and dates. No API key required.
steps:
  - Identify the P1 slot, skill, and agent mapped on /v1/p1.
  - Prefer local-v1 / local-v1-concise. Do not call hosted LLM APIs.
  - For legal asks, search FOLIO then CourtListener via POST /v1/legal/search.
  - Return a concrete work product, not a plan to write one.
resources:
  - path: .cursor/skills/p1-courtlistener/SKILL.md
  - path: server/p1-catalog.ts
