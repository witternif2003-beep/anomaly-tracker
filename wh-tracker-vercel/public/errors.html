<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WH Anomaly Tracker &middot; error queue</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; --bg: #070a0f; --panel: rgba(12, 18, 26, 0.86);
        --line: rgba(120, 150, 180, 0.22); --text: #dce6f2; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
        font: 13px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 16px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
      header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
      h1 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: #7d8da0; }
      #error-count { font-variant-numeric: tabular-nums; font-weight: 600; }
      #error-count[data-state="errors"] { color: #e2504b; }
      #error-count[data-state="clear"] { color: #3ad07f; }
      button { margin-left: auto; background: rgba(75, 142, 208, 0.16); color: var(--text);
        border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
      .error { border-left: 3px solid #4b5c70; padding: 6px 0 6px 10px; margin-bottom: 10px; }
      .error .title { font-weight: 600; word-break: break-word; }
      .error .row { color: #7d8da0; font-size: 11px; word-break: break-word; }
      .error.critical { border-color: #e2504b; }
      .error.high { border-color: #f0762f; }
      .error.medium { border-color: #e0b13c; }
      .empty { color: #7d8da0; font-style: italic; }
      .note { color: #7d8da0; font-size: 11px; margin: 10px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <header>
          <h1>Error queue</h1>
          <span id="error-count" data-state="clear">0</span>
          <button id="error-clear" type="button">clear</button>
        </header>
        <div id="error-list"><p class="empty">No errors observed this session.</p></div>
        <p class="note">
          Scout bot probes <code>/api/health</code>, <code>/api/topology</code> and
          <code>/api/reference-topology</code> every 60&nbsp;s and captures uncaught errors,
          rejected promises and failed requests in this browser session. Only observed
          failures are listed — nothing is simulated.
        </p>
      </section>
    </main>

    <script type="module">
      import { createScout } from "/scout.js";
      import { mountErrorQueue } from "/error-queue.js";

      const scout = createScout({
        endpoints: ["/api/health", "/api/topology", "/api/reference-topology"],
      });
      mountErrorQueue({
        scout,
        list: document.getElementById("error-list"),
        count: document.getElementById("error-count"),
        clearButton: document.getElementById("error-clear"),
      });
      scout.start();
    </script>
  </body>
</html>
