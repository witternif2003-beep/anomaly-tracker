services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omega
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: omega
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "omega"]
      interval: 5s
      retries: 20
  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://omega:${POSTGRES_PASSWORD}@postgres:5432/omega
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (>= 32 chars)}
      BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
    ports: ["3000:3000"]
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/omega-alerts.yml
    ports: ["9090:9090"]
configs:
  prometheus:
    content: |
      rule_files: [/etc/prometheus/omega-alerts.yml]
      scrape_configs:
        - job_name: omega
          metrics_path: /api/metrics
          static_configs: [{ targets: ["app:3000"] }]
  prometheus_rules:
    content: |
      groups:
        - name: omega
          rules:
            - alert: OmegaAgentRunwayLow
              expr: omega_agent_credit_runway_hours < 24
              for: 10m
              annotations: { summary: "{{ $$labels.address }} has under 24 h of Conway credits at current burn" }
            - alert: OmegaAgentSnapshotStale
              expr: omega_agent_snapshot_age_seconds > 900
              for: 5m
              annotations: { summary: "{{ $$labels.address }} has not synced a signed snapshot for 15 min" }
            - alert: OmegaAgentLosingMoney
              expr: omega_agent_net_cents_per_hour < 0
              for: 6h
              annotations: { summary: "{{ $$labels.address }} net P&L has fallen for 6 h" }
            - alert: OmegaAgentCriticalTier
              expr: omega_agent_survival_tier{tier=~"critical|dead"} == 1
              annotations: { summary: "{{ $$labels.address }} is in survival tier {{ $$labels.tier }}" }
volumes:
  pgdata:
