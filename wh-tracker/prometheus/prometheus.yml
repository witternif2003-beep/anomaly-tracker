global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    stack: wh-tracker

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: tracker
    static_configs:
      - targets: ["tracker:3000"]
    metrics_path: /metrics

  - job_name: pdf-service
    static_configs:
      - targets: ["pdf-service:4005"]
    metrics_path: /metrics

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:4010"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
