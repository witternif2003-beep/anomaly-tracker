global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - receiver: critical
      matchers:
        - severity = critical
      continue: false

receivers:
  - name: default
    # Replace with a real receiver (slack_configs / email_configs / webhook_configs).
    webhook_configs:
      - url: http://tracker:3000/api/health
        send_resolved: false

  - name: critical
    webhook_configs:
      - url: http://tracker:3000/api/health
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ["alertname", "job"]
