name: wh-tracker

x-app-env: &app-env
  API_KEY: ${API_KEY:?set API_KEY in .env}
  FEC_API_KEY: ${FEC_API_KEY:-}
  FEC_COMMITTEE_IDS: ${FEC_COMMITTEE_IDS:-}
  FEC_CYCLE: ${FEC_CYCLE:-}
  OTX_API_KEY: ${OTX_API_KEY:-}
  OTX_INDICATORS: ${OTX_INDICATORS:-}
  TAXII_URL: ${TAXII_URL:-}
  TAXII_USER: ${TAXII_USER:-}
  TAXII_PASS: ${TAXII_PASS:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  TRACKER_URL: http://tracker:3000
  TZ: ${TZ:-UTC}

services:
  tracker:
    build: .
    image: wh-tracker/tracker
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3000
      PDF_SERVICE_URL: http://pdf-service:4005
    ports:
      - "${TRACKER_BIND:-0.0.0.0}:${TRACKER_PORT:-3000}:3000"
    volumes:
      - tracker-data:/app/data
      - tracker-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile.pdf
    image: wh-tracker/pdf-service
    restart: unless-stopped
    environment:
      <<: *app-env
      PDF_PORT: 4005
    ports:
      # Chromium runs with --no-sandbox; keep the renderer off public
      # interfaces unless PDF_BIND is set deliberately.
      - "${PDF_BIND:-127.0.0.1}:${PDF_PORT:-4005}:4005"
    volumes:
      - pdf-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    build: .
    image: wh-tracker/tracker
    restart: unless-stopped
    command: ["node", "src/pipeline-scheduler.js"]
    environment:
      <<: *app-env
      SCHEDULER_PORT: 4010
      FEC_INTERVAL_MINUTES: ${FEC_INTERVAL_MINUTES:-360}
      TREASURY_INTERVAL_MINUTES: ${TREASURY_INTERVAL_MINUTES:-720}
      OTX_INTERVAL_MINUTES: ${OTX_INTERVAL_MINUTES:-180}
    volumes:
      - scheduler-logs:/app/logs
    depends_on:
      tracker:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - tracker

  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/config.yml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-0.0.0.0}:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - prometheus

volumes:
  tracker-data:
  tracker-logs:
  pdf-logs:
  scheduler-logs:
  prometheus-data:
  alertmanager-data:
  grafana-data:
